<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Abstract grid representing financial systems infrastructure">
  <rect width="480" height="320" fill="#101010"/>
  <defs>
    <linearGradient id="fgrid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="480" height="320" fill="url(#fgrid)" opacity="0.25"/>
  <g stroke="#3A3A3A" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="320"/>
    <line x1="140" y1="0" x2="140" y2="320"/>
    <line x1="220" y1="0" x2="220" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="380" y1="0" x2="380" y2="320"/>
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
  </g>
  <polyline points="30,260 110,220 190,240 260,150 340,170 420,90" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <g fill="#2563EB">
    <circle cx="110" cy="220" r="4"/>
    <circle cx="260" cy="150" r="4"/>
    <circle cx="420" cy="90" r="4"/>
  </g>
</svg>
